<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Plazmo Drive</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <img src="plazmodrive.jpg" class="logo" alt="Plazmo Drive">
    <h1>Gestión de Usuarios</h1>
</header>

<div class="contenedor">
    <h2>Listado de Usuarios</h2>

    <input type="text" id="buscar" placeholder="Buscar usuario..." oninput="mostrar()">

    <div class="lista" id="lista">
        <p>Cargando...</p>
    </div>

    <button onclick="window.location.href='home.html'">Volver</button>
</div>

<script>
const API = "http://127.0.0.1:8080/plazmodrive/api";
let usuarios = [];

function mostrar() {
    const lista = document.getElementById("lista");
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    lista.innerHTML = "";

    const filtrados = usuarios.filter(u =>
        (u.nombres + " " + u.apellidos + " " + u.cedula).toLowerCase().includes(q));

    if (filtrados.length === 0) {
        const p = document.createElement("p");
        p.textContent = "No hay usuarios para mostrar.";
        lista.appendChild(p);
        return;
    }

    filtrados.forEach(u => {
        const p = document.createElement("p");
        p.textContent = "• " + u.nombres + " " + u.apellidos + " - " + u.cedula + " - " + u.rol;
        lista.appendChild(p);
    });
}

async function cargar() {
    try {
        const res = await fetch(API + "/usuarios");
        usuarios = await res.json();
        mostrar();
    } catch (e) {
        document.getElementById("lista").innerHTML = "<p>No se pudo conectar con el servidor.</p>";
    }
}

cargar();
</script>

</body>
</html>
