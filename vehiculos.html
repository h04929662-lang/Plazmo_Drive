<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Vehículos - Plazmo Drive</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <img src="plazmodrive.jpg" class="logo" alt="Plazmo Drive">
    <h1>Gestión de Vehículos</h1>
</header>

<div class="contenedor">
    <h2>Inventario</h2>

    <input type="text" id="buscar" placeholder="Buscar vehículo..." oninput="mostrar()">

    <div class="lista" id="lista">
        <p>Cargando...</p>
    </div>

    <button onclick="window.location.href='registrar-vehiculo.html'">Registrar Vehículo</button>
    <button onclick="window.location.href='home.html'">Volver</button>
</div>

<script>
const API = "http://127.0.0.1:8080/plazmodrive/api";
let vehiculos = [];

function capitalizar(t) {
    t = (t || "").toLowerCase();
    return t.charAt(0).toUpperCase() + t.slice(1);
}

function mostrar() {
    const lista = document.getElementById("lista");
    const q = document.getElementById("buscar").value.trim().toLowerCase();
    lista.innerHTML = "";

    const filtrados = vehiculos.filter(v =>
        (v.marca + " " + v.modelo + " " + v.placa).toLowerCase().includes(q));

    if (filtrados.length === 0) {
        const p = document.createElement("p");
        p.textContent = "No hay vehículos para mostrar.";
        lista.appendChild(p);
        return;
    }

    filtrados.forEach(v => {
        const p = document.createElement("p");
        p.textContent = "• " + v.marca + " " + v.modelo + " - " + v.placa + " - " + capitalizar(v.estado);
        lista.appendChild(p);
    });
}

async function cargar() {
    try {
        const res = await fetch(API + "/vehiculos");
        vehiculos = await res.json();
        mostrar();
    } catch (e) {
        document.getElementById("lista").innerHTML = "<p>No se pudo conectar con el servidor.</p>";
    }
}

cargar();
</script>

</body>
</html>
