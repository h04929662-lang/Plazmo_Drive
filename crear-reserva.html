<!DOCTYPE html>
<html lang="es">
<head>

    <title>Crear Reserva - Plazmo Drive</title>

</head>
<body>

<header>
    <img src="plazmodrive.jpg" class="logo" alt="Plazmo Drive">
    <h1>Crear Reserva</h1>
</header>

<div class="contenedor">

</body>
</html>
