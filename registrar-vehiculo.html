<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Vehículo - Plazmo Drive</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <img src="plazmodrive.jpg" class="logo" alt="Plazmo Drive">
    <h1>Registrar Vehículo</h1>
</header>

<div class="contenedor">
    <h2>Nuevo Vehículo</h2>

    <input type="text" placeholder="Marca">
    <input type="text" placeholder="Modelo">
    <input type="text" placeholder="Placa">
    <input type="text" placeholder="Color">
    <input type="text" placeholder="Tipo de Vehículo (Carro, Moto, etc.)">
    <input type="text" placeholder="Estado (Disponible / Alquilado)">

    <button>Registrar</button>
    <button onclick="window.location.href='vehiculos.html'">Volver</button>
</div>

</body>
</html>
