<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Paleta de Colores - Plazmo Drive</title>
    <link rel="stylesheet" href="estilos.css">

    <style>
        .color-box {
            width: 100%;
            padding: 20px;
            margin: 10px 0;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
       <img src="plazmodrive.jpg" alt="Plazmo Drive" 
         alt="Logo Plazmo Drive"
         style="width:180px; display:block; margin:0 auto 10px;">
    <h1>PALETA DE COLORES</h1>
</header>

<div class="contenedor">

    <div class="color-box" style="background: var(--morado);">Morado (#7b2ff7)</div>
    <div class="color-box" style="background: var(--rosado);">Rosado (#e84393)</div>
    <div class="color-box" style="background: var(--azul);">Azul (#00b4d8)</div>
    <div class="color-box" style="background: var(--amarillo); color:black;">Amarillo (#ffcc00)</div>

</div>

</body>
</html>
